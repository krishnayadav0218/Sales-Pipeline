# Render Blueprint -- deploys this pipeline as a scheduled Cron Job.
# Push this repo to GitHub, then on Render: New -> Blueprint -> connect the repo.
# Render will read this file and set everything up automatically.
#
# You still need to manually add the 3 environment variables listed below
# in the Render dashboard (Environment tab) after the service is created --
# secrets should never be committed into the repo / this file.

services:
  - type: cron
    name: sales-pipeline
    env: python
    schedule: "30 2 * * *"   # UTC time -- 2:30 AM UTC = 8:00 AM IST. Adjust as needed.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python sales_pipeline.py"
    envVars:
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false   # set manually in Render dashboard (paste full JSON key)
      - key: RAW_FOLDER_ID
        sync: false   # set manually in Render dashboard
      - key: OUTPUT_FOLDER_ID
        sync: false   # set manually in Render dashboard
