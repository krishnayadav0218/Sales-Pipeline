name: Sales Pipeline

# Runs automatically on a schedule, and can also be triggered manually
# from the "Actions" tab in GitHub for testing (the "Run workflow" button).
on:
  schedule:
    # UTC time. 30 2 * * * = 2:30 AM UTC = 8:00 AM IST, every day.
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sales pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RAW_FOLDER_ID: ${{ secrets.RAW_FOLDER_ID }}
          OUTPUT_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        run: python sales_pipeline.py
